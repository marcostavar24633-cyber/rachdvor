<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11120f"><meta name="description" content="Карточка товара магазина «Рачный двор». Уточните параметры, наличие и стоимость у продавца."><title>Товар — Рачный двор</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#11120f;--surface:#1b1d19;--gold:#d8b66e;--gold2:#f0d99d;--text:#f7f3e9;--muted:#b9b8ad;--line:#383a31;--max:1050px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 36px));margin:auto}.nav{height:72px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.1em}.brand span{color:var(--gold)}.nav a:last-child{color:var(--gold2)}main{padding:45px 0 80px}.crumb{font-size:.85rem;color:var(--muted);margin-bottom:22px}.product{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:start}.photo{border:1px solid var(--line);border-radius:24px;overflow:hidden}.photo img{width:100%;height:440px;object-fit:cover}.tag{color:var(--gold);font-size:.75rem;font-weight:850;letter-spacing:.15em}.info h1{font-size:clamp(2.2rem,5vw,3.7rem);line-height:1.02;letter-spacing:-.05em;margin:12px 0}.info p{color:var(--muted)}.facts{display:grid;gap:0;margin:22px 0;border-block:1px solid var(--line)}.fact{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #ffffff12}.fact:last-child{border:0}.fact span{color:var(--muted)}.form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:24px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:.82rem;color:#cbc7ba}.field input,.field select,.field textarea{width:100%;min-height:44px;background:#11130f;border:1px solid #4a4b40;border-radius:11px;padding:10px;color:var(--text);font:inherit}.btn{width:100%;display:inline-flex;justify-content:center;align-items:center;min-height:50px;border-radius:999px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17170f;font-weight:850;border:0;cursor:pointer}.note{font-size:.8rem;color:var(--muted)}.status{color:var(--gold2);font-size:.85rem}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:.83rem}
@media(max-width:760px){.product{grid-template-columns:1fr}.photo img{height:300px}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">РАЧНЫЙ <span>ДВОР</span></a><a href="catalog.html">← В каталог</a></div></header>
<main class="wrap"><div class="crumb"><a href="index.html">Главная</a> / <a href="catalog.html">Каталог</a> / <span id="crumbName">Товар</span></div>
<div class="product"><div class="photo"><img id="productImage" src="" alt="" fetchpriority="high"></div><section class="info"><div class="tag" id="productTag"></div><h1 id="productName">Загрузка…</h1><p id="productDescription"></p>
<div class="facts"><div class="fact"><b>Размеры</b><span>[заполнить]</span></div><div class="fact"><b>Фасовка</b><span>[заполнить]</span></div><div class="fact"><b>Состав</b><span>[заполнить]</span></div><div class="fact"><b>Стоимость</b><span>Уточняется</span></div><div class="fact"><b>Наличие</b><span>Уточняется</span></div></div>
<div class="form"><h2>Уточнить этот товар</h2><form id="request"><div class="field"><label for="quantity">Желаемое количество / вес</label><input id="quantity" placeholder="Например, 2 кг"></div><div class="field"><label for="contact">Ваш телефон или мессенджер</label><input id="contact" required placeholder="+7 ..." autocomplete="tel"></div><div class="field"><label for="comment">Комментарий</label><textarea id="comment" rows="2" placeholder="Дата, город, вопросы"></textarea></div><button class="btn">Подготовить запрос</button><p class="note">Отправка запроса не подтверждает наличие или заказ. Все условия согласуются с продавцом.</p><p class="status" id="status" role="status" aria-live="polite"></p></form></div></section></div></main>
<footer><div class="wrap">© <span id="year"></span> Рачный двор · <a href="catalog.html">Каталог</a></div></footer>
<script>
const id=new URLSearchParams(location.search).get('id')||'classic';
const SHOP={whatsapp:'',email:''};
(async()=>{let item;try{const r=await fetch('/api/catalog',{cache:'no-store'});if(!r.ok)throw Error('catalog');const data=await r.json();item=(data.products||[]).find(p=>p.id===id&&p.available!==false);}catch{}
if(!item){document.getElementById('productName').textContent='Товар не найден';document.getElementById('productDescription').textContent='Вернитесь в каталог и выберите доступную позицию.';return;}
document.title=item.name+' — Рачный двор';document.getElementById('crumbName').textContent=item.name;document.getElementById('productName').textContent=item.name;document.getElementById('productTag').textContent=item.tag||item.category||'';document.getElementById('productDescription').textContent=item.description||'';const image=document.getElementById('productImage');image.src=item.image||'';image.alt='Фотография: '+item.name;document.getElementById('year').textContent=new Date().getFullYear();
document.getElementById('request').addEventListener('submit',e=>{e.preventDefault();const quantity=document.getElementById('quantity').value.trim()||'не указано',contact=document.getElementById('contact').value.trim(),comment=document.getElementById('comment').value.trim()||'нет';const message=`Здравствуйте! Интересует: ${item.name}. Количество: ${quantity}. Контакт: ${contact}. Комментарий: ${comment}. Подскажите наличие, стоимость и условия получения.`;const status=document.getElementById('status');if(SHOP.whatsapp){window.open(`https://wa.me/${SHOP.whatsapp}?text=${encodeURIComponent(message)}`,'_blank','noopener');status.textContent='Открыт WhatsApp с подготовленным запросом.';}else if(SHOP.email){location.href=`mailto:${SHOP.email}?subject=${encodeURIComponent(item.name)}&body=${encodeURIComponent(message)}`;status.textContent='Открыта почта с подготовленным запросом.';}else if(navigator.clipboard){navigator.clipboard.writeText(message).then(()=>status.textContent='Текст запроса скопирован. Добавьте контакт продавца в SHOP в файле product.html.').catch(()=>status.textContent='Не удалось скопировать запрос.');}else{status.textContent=message;}});
})();
</script></body></html>
