<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11120f"><meta name="description" content="Карточка товара магазина «Рачный двор». Уточните параметры, наличие и стоимость у продавца."><title>Товар — Рачный двор</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#11120f;--surface:#1b1d19;--gold:#d8b66e;--gold2:#f0d99d;--text:#f7f3e9;--muted:#b9b8ad;--line:#383a31;--max:1050px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 36px));margin:auto}.nav{height:72px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.1em}.brand span{color:var(--gold)}.nav a:last-child{color:var(--gold2)}main{padding:45px 0 80px}.crumb{font-size:.85rem;color:var(--muted);margin-bottom:22px}.product{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:start}.photo{border:1px solid var(--line);border-radius:24px;overflow:hidden}.photo img{width:100%;height:440px;object-fit:cover}.tag{color:var(--gold);font-size:.75rem;font-weight:850;letter-spacing:.15em}.info h1{font-size:clamp(2.2rem,5vw,3.7rem);line-height:1.02;letter-spacing:-.05em;margin:12px 0}.info p{color:var(--muted)}.facts{display:grid;gap:0;margin:22px 0;border-block:1px solid var(--line)}.fact{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #ffffff12}.fact:last-child{border:0}.fact span{color:var(--muted)}.form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:24px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:.82rem;color:#cbc7ba}.field input,.field select,.field textarea{width:100%;min-height:44px;background:#11130f;border:1px solid #4a4b40;border-radius:11px;padding:10px;color:var(--text);font:inherit}.btn{width:100%;display:inline-flex;justify-content:center;align-items:center;min-height:50px;border-radius:999px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17170f;font-weight:850;border:0;cursor:pointer}.note{font-size:.8rem;color:var(--muted)}.status{color:var(--gold2);font-size:.85rem}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:.83rem}
@media(max-width:760px){.product{grid-template-columns:1fr}.photo img{height:300px}}

/* Coastal Nocturne — MASTER PROMPT 3.0 */
:root{--bg:#101916;--surface:#19231f;--surface2:#22302a;--gold:#d5a36c;--gold-light:#f1d4aa;--white:#f5f0e6;--text:#f5f0e6;--muted:#b8c0b6;--line:#35443b}
body{background:var(--bg);color:var(--white);letter-spacing:.005em}
header,.top{background:rgba(13,20,17,.9);border-color:#35443b;backdrop-filter:blur(14px)}
.logo small,.eyebrow,.tag,.brand span{color:#e1b47e}
.btn{border-radius:4px;background:linear-gradient(110deg,#f1d4aa,#c58b52);border:1px solid #e3b77f;color:#17170f;box-shadow:0 8px 28px #0002;transition:transform .25s,filter .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);filter:brightness(1.06);box-shadow:0 14px 32px #0004}
.btn.ghost{background:transparent;color:var(--white);border-color:#b88758}
.occasion,.feature,.step,.product,.card,.cart-panel,.order-form,.form,.faq details{background:linear-gradient(145deg,#1b2822,#17211c);border-color:#35443b;border-radius:5px}
.field input,.field select,.field textarea,.filters input,.filters select{background:#111a16;border-color:#46564b;border-radius:4px;color:var(--white)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold-light);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

main{padding:clamp(35px,6vw,72px) 0 90px}.photo{border-radius:4px;border-color:#9b744e}.photo img{filter:saturate(.78)}
.info h1{font-size:clamp(2.8rem,6vw,5.5rem);letter-spacing:-.075em}.facts{border-color:#35443b}.fact{border-color:#ffffff12}
</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">РАЧНЫЙ <span>ДВОР</span></a><a href="catalog.html">← В каталог</a></div></header>
<main class="wrap"><div class="crumb"><a href="index.html">Главная</a> / <a href="catalog.html">Каталог</a> / <span id="crumbName">Товар</span></div>
<div class="product"><div class="photo"><img id="productImage" src="" alt="" fetchpriority="high"></div><section class="info"><div class="tag" id="productTag"></div><h1 id="productName">Загрузка…</h1><p id="productDescription"></p>
<div class="facts"><div class="fact"><b>Размеры</b><span id="productSize">Уточняются</span></div><div class="fact"><b>Фасовка</b><span id="productUnit">Уточняется</span></div><div class="fact"><b>Состав</b><span id="productComposition">Уточняется</span></div><div class="fact"><b>Стоимость</b><span id="productPrice">Уточняется</span></div><div class="fact"><b>Наличие</b><span id="productAvailability">Уточняется</span></div></div>
<div class="form"><h2>Уточнить этот товар</h2><form id="request"><div class="field"><label for="quantity">Желаемое количество / вес</label><input id="quantity" placeholder="Например, 2 кг"></div><div class="field"><label for="contact">Ваш телефон или мессенджер</label><input id="contact" required placeholder="+7 ..." autocomplete="tel"></div><div class="field"><label for="comment">Комментарий</label><textarea id="comment" rows="2" placeholder="Дата, город, вопросы"></textarea></div><button class="btn">Подготовить запрос</button><p class="note">Отправка запроса не подтверждает наличие или заказ. Все условия согласуются с продавцом.</p><p class="status" id="status" role="status" aria-live="polite"></p></form></div></section></div></main>
<footer><div class="wrap">© <span id="year"></span> Рачный двор · <a href="catalog.html">Каталог</a></div></footer>
<script>
const id=new URLSearchParams(location.search).get('id')||'classic';
const SHOP={whatsapp:'',email:''};
(async()=>{let item;try{const r=await fetch('/api/catalog',{cache:'no-store'});if(!r.ok)throw Error('catalog');const data=await r.json();item=(data.products||[]).find(p=>p.id===id&&p.available!==false);}catch{}
if(!item){document.getElementById('productName').textContent='Товар не найден';document.getElementById('productDescription').textContent='Вернитесь в каталог и выберите доступную позицию.';return;}
document.title=item.name+' — Рачный двор';document.getElementById('crumbName').textContent=item.name;document.getElementById('productName').textContent=item.name;document.getElementById('productTag').textContent=item.tag||item.category||'';document.getElementById('productDescription').textContent=item.description||'';
document.getElementById('productSize').textContent=item.size||'Уточняется у продавца';
document.getElementById('productUnit').textContent=item.unit||'Уточняется у продавца';
document.getElementById('productComposition').textContent=item.composition||'Уточняется у продавца';
document.getElementById('productPrice').textContent=item.price!==''&&item.price!=null?String(item.price)+' ₽ / '+(item.unit||'ед.'):'Уточняется у продавца';
document.getElementById('productAvailability').textContent=item.available===false?'Нет в наличии':'Наличие подтверждает продавец';const image=document.getElementById('productImage');image.src=item.image||'';image.alt='Фотография: '+item.name;document.getElementById('year').textContent=new Date().getFullYear();
document.getElementById('request').addEventListener('submit',async e=>{
 e.preventDefault();const quantity=document.getElementById('quantity').value.trim()||'не указано';
 const contact=document.getElementById('contact').value.trim(),comment=document.getElementById('comment').value.trim()||'нет',status=document.getElementById('status');
 const payload={name:'',contact,comment,delivery:'Уточнить у продавца',items:[{id:item.id,name:item.name,option:'Уточнить доступные варианты',quantity,unit:item.unit||''}]};
 status.textContent='Отправляем запрос…';
 try{const response=await fetch('/api/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();
  if(response.ok&&result.saved){status.textContent='Запрос сохранён. Номер: '+result.orderId+'. '+(result.notificationSent?'Уведомление отправлено продавцу.':'Продавец пока не получил уведомление — свяжитесь с ним для подтверждения.');e.target.reset();return;}
  if(response.ok&&!result.saved){status.textContent='Запрос проверен, но не сохранён: хранилище заявок не подключено. Свяжитесь с продавцом напрямую.';return;}
  status.textContent=result.error||'Не удалось отправить запрос. Попробуйте ещё раз.';
 }catch{const message='Здравствуйте! Интересует: '+item.name+'. Количество: '+quantity+'. Контакт: '+contact+'. Комментарий: '+comment+'. Подскажите наличие, стоимость и условия получения.';
  try{await navigator.clipboard.writeText(message);status.textContent='Сервер недоступен. Текст запроса скопирован — отправьте его продавцу.';}catch{status.textContent='Сервер недоступен. Запрос: '+message;}
 }
});
})();
</script></body></html>
