<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#11120f">
<title>Заказы — Рачный двор</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{color-scheme:dark;--bg:#11120f;--panel:#1b1d19;--panel2:#23251f;--gold:#d8b66e;--text:#f7f3e9;--muted:#b9b8ad;--line:#383a31;--red:#d98778;--green:#9ac69b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{padding:28px 0 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.12em}.brand span{display:block;color:var(--gold);font-size:.68rem;letter-spacing:.25em}
h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.05em;margin:28px 0 6px}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}
button,select{font:inherit;border:1px solid #756746;border-radius:12px;padding:11px 14px;background:var(--panel2);color:var(--text)}
button{cursor:pointer}button.primary{background:linear-gradient(135deg,#f0d99d,var(--gold));color:#19180f;font-weight:800;border:0}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#message{min-height:24px;color:var(--gold);margin:10px 0}.orders{display:grid;gap:14px;margin:18px 0 50px}
.order{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:16px}
.order h2{font-size:1.1rem;margin:0 0 5px}.meta{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.items{margin:13px 0 0;padding-left:19px;color:#e7e1d2}.comment{margin-top:10px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.side{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap;justify-content:flex-end}.status{min-width:145px}
.empty{border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
@media(max-width:650px){.order{grid-template-columns:1fr}.side{justify-content:flex-start}.status{flex:1}.side button{flex:1}.toolbar button{flex:1}}

/* Coastal Nocturne — MASTER PROMPT 3.0 */
:root{--bg:#101916;--surface:#19231f;--surface2:#22302a;--gold:#d5a36c;--gold-light:#f1d4aa;--white:#f5f0e6;--text:#f5f0e6;--muted:#b8c0b6;--line:#35443b}
body{background:var(--bg);color:var(--white);letter-spacing:.005em}
header,.top{background:rgba(13,20,17,.9);border-color:#35443b;backdrop-filter:blur(14px)}
.logo small,.eyebrow,.tag,.brand span{color:#e1b47e}
.btn{border-radius:4px;background:linear-gradient(110deg,#f1d4aa,#c58b52);border:1px solid #e3b77f;color:#17170f;box-shadow:0 8px 28px #0002;transition:transform .25s,filter .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);filter:brightness(1.06);box-shadow:0 14px 32px #0004}
.btn.ghost{background:transparent;color:var(--white);border-color:#b88758}
.occasion,.feature,.step,.product,.card,.cart-panel,.order-form,.form,.faq details{background:linear-gradient(145deg,#1b2822,#17211c);border-color:#35443b;border-radius:5px}
.field input,.field select,.field textarea,.filters input,.filters select{background:#111a16;border-color:#46564b;border-radius:4px;color:var(--white)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold-light);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
 .pagination{display:flex;justify-content:center;margin:22px 0 50px}button:disabled{opacity:.55;cursor:wait}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">РАЧНЫЙ ДВОР<span>УПРАВЛЕНИЕ ЗАКАЗАМИ</span></div><div><a class="muted" href="index.html">← На сайт</a> <button id="logout">Выйти</button></div></header>
<main>
<h1>Заказы</h1><div class="muted">Список заявок из Cloudflare KV. Доступ защищён паролем администратора.</div>
<div class="toolbar">
<button class="primary" id="refresh">Обновить список</button>
<label class="muted" for="filter">Показать:</label>
<select id="filter"><option value="">Все статусы</option><option>Новый</option><option>Принят</option><option>Готовится</option><option>Выполнен</option><option>Отменён</option></select>
</div>
<div id="message" role="status" aria-live="polite"></div>
<section class="orders" id="orders"><div class="empty">Загрузка заказов…</div></section>
<div class="pagination"><button class="primary" id="loadMore" hidden>Загрузить ещё</button></div>
</main>
</div>
<script>
const root=document.querySelector('#orders'), message=document.querySelector('#message'), filter=document.querySelector('#filter'), loadMoreButton=document.querySelector('#loadMore');
const statuses=['Новый','Принят','Готовится','Выполнен','Отменён'];
let allOrders=[], nextCursor=null, loading=false;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?'Дата не указана':d.toLocaleString('ru-RU')};
async function load(reset=true){
 if(loading)return;
 if(reset){allOrders=[];nextCursor=null;root.innerHTML='<div class="empty">Загрузка заказов…</div>';}
 loading=true;loadMoreButton.disabled=true;loadMoreButton.hidden=true;message.textContent=reset?'Загружаю заказы…':'Загружаю следующую страницу…';
 try{
  const params=new URLSearchParams({limit:'100'});if(nextCursor)params.set('cursor',nextCursor);
  const res=await fetch('/api/orders?'+params.toString(),{credentials:'same-origin',cache:'no-store'});
  const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||'Не удалось загрузить заказы.');
  const known=new Set(allOrders.map(o=>o.id));
  for(const order of (data.orders||[]))if(!known.has(order.id)){allOrders.push(order);known.add(order.id);}
  nextCursor=data.nextCursor||null;
  allOrders.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  render();
  message.textContent=nextCursor?'Загружено: '+allOrders.length+' заказов. Есть ещё страницы.':'Загружено заказов: '+allOrders.length+'. Архив просмотрен полностью.';
  loadMoreButton.hidden=!nextCursor;
 }catch(err){
  if(!allOrders.length)root.innerHTML='<div class="empty">Нет доступа или сервер не настроен. Проверьте вход администратора и привязку ORDERS_KV.</div>';
  message.textContent=err.message;loadMoreButton.hidden=!nextCursor;
 }finally{loading=false;loadMoreButton.disabled=false;}
}
function render(){
 const selected=filter.value, rows=allOrders.filter(o=>!selected||(o.status||'Новый')===selected);
 if(!rows.length){root.innerHTML='<div class="empty">Заказов с таким статусом среди загруженных страниц нет.</div>';return}
 root.innerHTML=rows.map(o=>`<article class="order" data-id="${esc(o.id)}">
 <div><h2>${esc(o.name||'Клиент без имени')}</h2><div class="meta">№ ${esc(o.id)} · ${esc(date(o.createdAt))}</div>
 <div><b>Контакт:</b> ${esc(o.contact||'—')}</div><div><b>Получение:</b> ${esc(o.delivery||'Уточнить')}</div>
 <ul class="items">${(o.items||[]).map(i=>`<li>${esc(i.name)} — ${esc(i.quantity)}${i.unit?' '+esc(i.unit):''}${i.option?' · '+esc(i.option):''}</li>`).join('')}</ul>
 ${o.comment?`<div class="comment"><b>Комментарий:</b> ${esc(o.comment)}</div>`:''}</div>
 <div class="side"><select class="status" aria-label="Статус заказа">${statuses.map(s=>`<option ${s===(o.status||'Новый')?'selected':''}>${s}</option>`).join('')}</select><button class="save">Сохранить</button></div>
 </article>`).join('');
 root.querySelectorAll('.save').forEach(btn=>btn.addEventListener('click',async()=>{
  const card=btn.closest('.order'), id=card.dataset.id, status=card.querySelector('.status').value;
  btn.disabled=true;btn.textContent='…';
  try{
   const res=await fetch('/api/order-status',{method:'PATCH',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({id,status})});
   const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||'Ошибка обновления');
   const order=allOrders.find(x=>x.id===id);if(order)order.status=status;
   message.textContent='Статус заказа обновлён: '+status;render();
  }catch(err){message.textContent=err.message;btn.disabled=false;btn.textContent='Сохранить'}
 }));
}
document.querySelector('#refresh').addEventListener('click',()=>load(true));
loadMoreButton.addEventListener('click',()=>load(false));
filter.addEventListener('change',render);
document.querySelector('#logout').addEventListener('click',async event=>{const button=event.currentTarget;button.disabled=true;button.textContent='Выходим…';try{await fetch('/api/admin-logout',{method:'POST',credentials:'same-origin'});}catch{}finally{location.replace('/admin-login.html');}});
load(true);
</script>
</body></html>
