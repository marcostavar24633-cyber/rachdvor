<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Вход администратора — Рачный двор</title><style>
:root{color-scheme:dark;--bg:#11120f;--panel:#1b1d19;--gold:#d8b66e;--text:#f7f3e9;--muted:#b9b8ad;--line:#383a31}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#29271e,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,sans-serif}.card{width:min(420px,100%);padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px #0006}.brand{text-align:center;font-weight:900;letter-spacing:.14em}.brand small{display:block;color:var(--gold);font-size:.68rem;letter-spacing:.24em}h1{font-size:1.7rem;margin:28px 0 6px}p{color:var(--muted);margin:0 0 22px}label{display:block;margin:14px 0 7px;color:#ddd5c2;font-size:.9rem}input{width:100%;padding:14px;border:1px solid #555344;border-radius:12px;background:#10120e;color:var(--text);font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:999px;background:linear-gradient(135deg,#f0d99d,var(--gold));color:#17170f;font:800 1rem system-ui;cursor:pointer}#message{min-height:24px;margin-top:14px;color:#e5bd73;font-size:.9rem}a{display:block;margin-top:18px;text-align:center;color:var(--muted)}</style></head><body><main class="card"><div class="brand">РАЧНЫЙ ДВОР<small>ЗАКРЫТАЯ ПАНЕЛЬ</small></div><h1>Вход администратора</h1><p>Введите пароль, чтобы открыть управление магазином.</p><form id="loginForm"><label for="password">Пароль администратора</label><input id="password" type="password" autocomplete="current-password" required autofocus><button type="submit" id="submit">Войти</button></form><div id="message" role="status" aria-live="polite"></div><a href="/">Вернуться на сайт</a></main><script>
const form=document.getElementById('loginForm'),message=document.getElementById('message'),button=document.getElementById('submit');const params=new URLSearchParams(location.search),requested=params.get('next'),next=requested==='/admin.html'||requested==='/admin-orders.html'?requested:'/admin-orders.html';
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Проверка…';message.textContent='';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Не удалось войти.');location.replace(next);}catch(err){message.textContent=err.message;button.disabled=false;button.textContent='Войти';}});
</script></body></html>
