<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Вход администратора — Рачный двор</title><style>
:root{color-scheme:dark;--bg:#101916;--panel:#19231f;--gold:#d5a36c;--gold-light:#f1d4aa;--text:#f5f0e6;--muted:#b8c0b6;--line:#35443b}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0,rgba(191,133,76,.2),transparent 42%),linear-gradient(145deg,#0b1410,#142019 58%,#101916);color:var(--text);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{position:relative;isolation:isolate;width:min(440px,100%);padding:clamp(26px,6vw,42px);background:linear-gradient(145deg,rgba(27,40,34,.97),rgba(20,30,25,.98));border:1px solid var(--line);border-radius:5px;box-shadow:0 28px 90px rgba(0,0,0,.42)}
.card:before{content:"";position:absolute;z-index:-1;inset:10px;border:1px solid rgba(213,163,108,.12);pointer-events:none}
.brand{text-align:center;font-weight:950;letter-spacing:.14em;font-size:1.08rem}
.brand small{display:block;color:#e1b47e;font-size:.65rem;letter-spacing:.27em;margin-top:8px}
h1{font-size:clamp(1.7rem,5vw,2.1rem);letter-spacing:-.045em;margin:34px 0 7px}
p{color:var(--muted);margin:0 0 24px}
label{display:block;margin:16px 0 7px;color:#ded7c8;font-size:.88rem}
input{width:100%;min-height:52px;padding:12px 14px;border:1px solid #46564b;border-radius:4px;background:#111a16;color:var(--text);font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(213,163,108,.14)}
button{width:100%;min-height:52px;margin-top:20px;padding:12px 18px;border:1px solid #e3b77f;border-radius:4px;background:linear-gradient(110deg,#f1d4aa,#c58b52);color:#17170f;font:850 1rem Inter,system-ui,sans-serif;cursor:pointer;transition:transform .25s,filter .25s}
button:hover{transform:translateY(-2px);filter:brightness(1.06)}button:disabled{opacity:.65;cursor:wait;transform:none}
#message{min-height:24px;margin-top:14px;color:#efc99a;font-size:.88rem}
a{display:block;margin-top:20px;text-align:center;color:var(--muted);font-size:.88rem;text-underline-offset:4px}a:hover{color:var(--gold-light)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold-light);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body><main class="card"><div class="brand">РАЧНЫЙ ДВОР<small>ЗАКРЫТАЯ ПАНЕЛЬ</small></div><h1>Вход администратора</h1><p>Введите пароль, чтобы открыть управление магазином.</p><form id="loginForm"><label for="password">Пароль администратора</label><input id="password" type="password" autocomplete="current-password" required autofocus><button type="submit" id="submit">Войти</button></form><div id="message" role="status" aria-live="polite"></div><a href="/">Вернуться на сайт</a></main><script>
const form=document.getElementById('loginForm'),message=document.getElementById('message'),button=document.getElementById('submit');const params=new URLSearchParams(location.search),requested=params.get('next'),next=requested==='/admin.html'||requested==='/admin-orders.html'?requested:'/admin-orders.html';
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Проверка…';message.textContent='';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Не удалось войти.');location.replace(next);}catch(err){message.textContent=err.message;button.disabled=false;button.textContent='Войти';}});
</script></body></html>
